# Prefer Docker for monorepo reliability on Railway.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'pnpm --filter @note-share/api exec prisma db push && pnpm --filter @note-share/api start'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
